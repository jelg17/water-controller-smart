<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Water Controller Smart</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="login">
    <aside class="login-marca">
      <h2>Water Controller Smart</h2>
      <p>Conoce tu consumo de agua de un vistazo y controla cuánto gastas cada mes.</p>
    </aside>

    <form class="login-form" id="formulario">
      <h2>Bienvenido de nuevo</h2>
      <p class="suave">Ingresa tus credenciales para ver tu panel de consumo.</p>
      <label class="campo">Correo electrónico
        <input type="email" id="correo" placeholder="nombre@correo.com" required>
      </label>
      <label class="campo">Contraseña
        <input type="password" placeholder="••••••••" required>
      </label>
      <button class="boton">Iniciar sesión</button>
    </form>
  </div>

  <script src="js/almacen.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
